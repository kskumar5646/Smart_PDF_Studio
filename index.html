<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart PDF Studio - Free PDF Tools</title>
<meta name="description" content="Smart PDF Studio - free browser-side PDF tools to merge, split, compress and convert PDF files.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://smart-pdf-studio.shantanukumar5646.workers.dev/">
<script type="application/ld+json">
/* SMART PDF STUDIO — reference-homepage visual shell.
   Functional tool renderer, handlers and conversion libraries are intentionally untouched. */
:root{--sp-navy:#17345f;--sp-blue:#2463d4;--sp-border:#dfe8f4;--sp-bg:#f7faff}
body{background:#f7faff!important;color:var(--sp-navy)!important}
header.sticky{height:66px!important;background:#fff!important;border-bottom:1px solid #e7edf6!important;box-shadow:0 1px 8px rgba(20,45,90,.035)!important}
header.sticky>div{height:66px!important;max-width:1445px!important;padding:0 0!important}
header.sticky>div>div:first-child{gap:10px!important}
header.sticky>div>div:first-child>div:first-child{
  width:38px!important;height:38px!important;border-radius:10px!important;
  background:linear-gradient(145deg,#3b82f6,#0f5fc9)!important;
  box-shadow:0 4px 10px rgba(37,99,235,.22)!important;
  font-size:12px!important;
}
header.sticky #headerTitle{font-size:18px!important;font-weight:800!important;color:#17345f!important}
#smartTopNav{display:flex;align-items:center;gap:6px;margin-left:42px;flex:1}
#smartTopNav button{
  border:0;background:transparent;color:#182b49;border-radius:14px;
  padding:10px 15px;font-size:14px;font-weight:500;white-space:nowrap;
}
#smartTopNav button[data-active="1"]{background:#e9f1ff;color:#175bc2;font-weight:700}
#smartTopNav button:hover{background:#f1f5fb}
#smartHeaderTools{display:flex;align-items:center;gap:12px}
#smartSearchBtn{
  width:40px;height:40px;border:1px solid #e6edf7;border-radius:14px;background:#fff;
  color:#17345f;font-size:17px;display:flex;align-items:center;justify-content:center;
}
#hero{padding:7px 0 0!important}
#hero>div:first-child{
  max-width:1445px!important;width:calc(100% - 90px)!important;height:174px!important;min-height:174px!important;
  margin:0 auto 20px!important;padding:29px 24px 22px!important;
  border:1px solid #e0e8f3!important;border-radius:20px!important;
  background:linear-gradient(108deg,#f5faff 0%,#edf6ff 58%,#f4f3ff 100%)!important;
  box-shadow:0 4px 15px rgba(20,50,100,.045)!important;text-align:left!important;
  position:relative;overflow:hidden;
}
#hero>div:first-child:before{
  content:"⚡  Fast • Free • Online";position:absolute;left:24px;top:21px;
  padding:6px 12px;border-radius:999px;background:#dceeff;color:#2767ad;
  font-size:12px;line-height:1;font-weight:700;z-index:5;
}
#hero>div:first-child:after{
  content:"";position:absolute;right:125px;top:18px;width:155px;height:140px;border-radius:50%;
  background:radial-gradient(circle,#dbeafe 0 35%,rgba(219,234,254,.28) 36% 63%,transparent 64%);
  opacity:.9;
}
#hero>div:first-child h1{
  position:relative;z-index:5;margin-top:39px!important;font-size:37px!important;
  line-height:1.08!important;letter-spacing:-1.15px!important;color:#17345f!important;font-weight:800!important;
}
#hero>div:first-child p{
  position:relative;z-index:5;margin-top:10px!important;font-size:16px!important;
  line-height:1.45!important;color:#30496e!important;
}
#hero>div:first-child h1 .sp-pdf-word{color:#3d72e7}
.smart-hero-art{position:absolute;right:22px;top:2px;width:570px;height:168px;z-index:4;pointer-events:none}
.smart-hero-art:before{content:"";position:absolute;right:20px;top:10px;width:350px;height:145px;border-radius:50%;background:radial-gradient(circle at 52% 48%,rgba(255,255,255,.96) 0 28%,rgba(226,236,255,.70) 29% 55%,rgba(238,244,255,.18) 56% 72%,transparent 73%);}
.smart-pdf-card{
  position:absolute;right:115px;top:38px;width:82px;height:106px;border-radius:9px;
  background:linear-gradient(145deg,#ff6666,#ed3f46);box-shadow:0 15px 28px rgba(239,68,68,.22);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:900;
  transform:rotate(-1deg);
}
.smart-pdf-card:before{content:"";position:absolute;left:15px;top:27px;width:42px;height:42px;border:3px solid rgba(255,255,255,.9);border-radius:50%}
.smart-pdf-card:after{content:"";position:absolute;left:33px;top:37px;width:9px;height:27px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-35deg)}
.smart-float{position:absolute;display:flex;align-items:center;justify-content:center;font-weight:900;border-radius:9px;box-shadow:0 5px 13px rgba(15,23,42,.12);font-size:18px}
.smart-float.w{right:246px;top:20px;width:38px;height:38px;background:#1570d2;color:#fff;transform:rotate(-8deg)}
.smart-float.x{right:37px;top:20px;width:38px;height:38px;background:#16a34a;color:#fff;transform:rotate(7deg)}
.smart-float.i{right:267px;top:94px;width:35px;height:35px;background:#9b35ca;color:#fff;transform:rotate(-8deg)}
.smart-float.j{right:18px;top:88px;width:38px;height:38px;background:#f4b400;color:#fff;transform:rotate(8deg)}
.smart-hand{
  position:absolute;right:350px;top:48px;width:155px;text-align:center;color:#163e87;
  font-family:"Comic Sans MS","Segoe Print",cursive;font-size:17px;line-height:1.12;
  transform:rotate(-4deg);
}
.smart-hand:after{content:"";display:block;width:105px;border-bottom:2px solid #4777c9;transform:rotate(-6deg);margin:5px auto 0}
#toolsGrid{
  max-width:1445px!important;width:calc(100% - 90px)!important;
  grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:20px!important;
  padding:0 0 18px!important;
}
#toolsGrid>.col-span-full{display:none!important}
#toolsGrid>button{
  position:relative;min-height:168px!important;padding:19px 26px!important;border-radius:19px!important;
  border:1px solid rgba(148,163,184,.24)!important;box-shadow:0 5px 14px rgba(15,23,42,.045)!important;
  overflow:hidden;transform:none!important;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease!important;
  text-align:left!important;
}
#toolsGrid>button:hover{transform:translateY(-2px)!important;box-shadow:0 12px 25px rgba(15,23,42,.085)!important}
#toolsGrid>button:after{
  content:"›";position:absolute;right:18px;top:19px;width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.72);
  color:#2364c8;font-size:24px;font-weight:400;line-height:1;
}
#toolsGrid>button>div{display:block!important}
#toolsGrid>button>div>div:first-child{
  width:48px!important;height:48px!important;margin:0 0 13px!important;border-radius:10px!important;
  box-shadow:0 4px 10px rgba(15,23,42,.08);display:flex!important;align-items:center;justify-content:center;
}
#toolsGrid>button>div>div:last-child{width:100%!important}
#toolsGrid>button h3{
  display:block!important;margin:0!important;padding-right:30px;color:#17345f!important;font-size:17px!important;line-height:1.3!important;
}
#toolsGrid>button p{margin-top:7px!important;color:#64748b!important;font-size:13px!important;line-height:1.5!important}
#toolsGrid>button:nth-child(4n+1){background:linear-gradient(145deg,#fffafa,#fff)!important;border-color:#f0dede!important}
#toolsGrid>button:nth-child(4n+2){background:linear-gradient(145deg,#f8fffc,#fff)!important;border-color:#dceee7!important}
#toolsGrid>button:nth-child(4n+3){background:linear-gradient(145deg,#f8fbff,#fff)!important;border-color:#d9e5f4!important}
#toolsGrid>button:nth-child(4n){background:linear-gradient(145deg,#fffdfa,#fff)!important;border-color:#eee5d5!important}
#smartFeatured{
  max-width:1445px;width:calc(100% - 90px);height:156px;margin:0 auto 32px;
  border:1px solid #dfe7f2;border-radius:20px;background:linear-gradient(100deg,#fbfdff,#f7fbff);
  box-shadow:0 4px 15px rgba(20,50,100,.045);display:grid;grid-template-columns:1fr 1.08fr;
  gap:28px;align-items:center;padding:20px 24px;
}
#smartFeatured .sf-title{display:flex;align-items:center;gap:14px}
#smartFeatured .sf-icon{width:48px;height:48px;border-radius:10px;background:#dbeafe;color:#1761c6;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;box-shadow:0 4px 10px rgba(37,99,235,.12)}
#smartFeatured h2{font-size:21px;font-weight:800;color:#17345f;margin:0}
#smartFeatured .sf-desc{font-size:13px;color:#64748b;margin-top:3px}
#smartFeatured .sf-points{display:flex;gap:24px;margin-top:18px;font-size:12px;color:#94a3b8}
#smartFeatured .sf-points span:before{content:"✓";color:#2563d4;font-weight:900;margin-right:8px}
#smartFeatured .sf-box{height:118px;border:1px solid #d3deeb;border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
#smartFeatured .sf-cloud{font-size:23px;color:#1d6bd6;margin-bottom:5px}
#smartFeatured .sf-drop{font-size:12px;color:#52627a;margin-bottom:8px}
#smartFeatured .sf-btn{
  border:0;border-radius:12px;background:#173b7a;color:#fff;font-size:14px;font-weight:800;
  height:38px;padding:0 52px;cursor:pointer;box-shadow:0 4px 10px rgba(23,59,122,.18);
}
#smartFeatured .sf-btn:hover{background:#102f63}
[data-i18n="process"],[data-i18n="processing"]{
  background:#173b7a!important;background-color:#173b7a!important;border-color:#173b7a!important;color:#fff!important
}
[data-i18n="process"]:hover,[data-i18n="processing"]:hover{background:#102f63!important;background-color:#102f63!important}
@media(max-width:1050px){
  #smartTopNav{margin-left:15px;gap:2px}
  #smartTopNav button{padding:9px 9px;font-size:13px}
  #toolsGrid{grid-template-columns:repeat(3,minmax(0,1fr))!important}
  .smart-hero-art{right:-20px;opacity:.72}
  #smartFeatured{grid-template-columns:1fr 1fr}
}
@media(max-width:760px){
  header.sticky>div{padding:0 14px!important}
  #smartTopNav{display:none}
  #hero>div:first-child,#toolsGrid,#smartFeatured{width:calc(100% - 28px)!important}
  #hero>div:first-child{height:205px!important;min-height:205px!important;border-radius:18px!important;padding:28px 20px!important}
  #hero>div:first-child h1{font-size:28px!important;max-width:68%!important}
  #hero>div:first-child p{font-size:14px!important;max-width:68%!important}
  .smart-hero-art{right:-135px;top:18px;transform:scale(.75);transform-origin:right top;opacity:.78}
  #toolsGrid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:14px!important}
  #toolsGrid>button{min-height:158px!important;padding:17px!important}
  #smartFeatured{height:auto;grid-template-columns:1fr;padding:16px;margin-bottom:24px}
}
@media(max-width:480px){
  #toolsGrid{grid-template-columns:1fr!important}
  #hero>div:first-child h1,#hero>div:first-child p{max-width:100%!important}
  .smart-hero-art{opacity:.35;right:-210px}
}
</script>
